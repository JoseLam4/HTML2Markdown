<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Prueba de listas</title>
</head>
<body>
    <h2>Lista no ordenada</h2>
    <ul>
        <li>Portabilidad</li>
        <li>Seguridad
            <ul>
                <li>Control de tipos</li>
                <li>Gestión de memoria</li>
            </ul>
        </li>
        <li>Rendimiento</li>
    </ul>

    <h2>Lista ordenada</h2>

        <li>Descargar HTML</li>
        <li>Analizar estructura
            <ol>
                <li>Etiquetas de inicio</li>
                <li>Etiquetas de cierre</li>
            </ol>
        </li>
        <li>Guardar archivo Markdown</li>
    </ol>
</body>
</html>
